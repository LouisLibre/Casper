<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="midnight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#382e63"/>
      <stop offset="1" stop-color="#1b1547"/>
    </linearGradient>
    <!-- Rim light, as on the Big Sur style icons: lit from the top-left corner and again from
         the bottom-right, dim at the other two corners. One gradient along the diagonal does it:
         bright at both ends, faint in the middle where the top-right and bottom-left corners sit. -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.30"/>
    </linearGradient>
    <filter id="soften" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <path id="squircle" d="M 628 100 c 103.61 0 155.41 0 194.99 20.16 a 185 185 0 0 1 80.85 80.85 c 20.16 39.57 20.16 91.38 20.16 194.99 L 924 628 c 0 103.61 0 155.41 -20.16 194.99 a 185 185 0 0 1 -80.85 80.85 c -39.57 20.16 -91.38 20.16 -194.99 20.16 L 396 924 c -103.61 0 -155.41 0 -194.99 -20.16 a 185 185 0 0 1 -80.85 -80.85 c -20.16 -39.57 -20.16 -91.38 -20.16 -194.99 L 100 396 c 0 -103.61 0 -155.41 20.16 -194.99 a 185 185 0 0 1 80.85 -80.85 c 39.57 -20.16 91.38 -20.16 194.99 -20.16 Z"/>
    <clipPath id="inside"><use href="#squircle"/></clipPath>
  </defs>

  <use href="#squircle" fill="url(#midnight)"/>

  <!-- The notch pill's ghost (NotchGhostMascot / MenuBarIcon.svg) in its 70x70 box, scaled 7x.
       Sits 28px above true center so it reads as centered: the dome is heavier than the bumps. -->
  <g transform="translate(267 239) scale(7)">
    <path d="M 5 30 A 30 30 0 0 1 65 30 L 65 60 A 10 10 0 0 1 45 60 A 10 10 0 0 1 25 60 A 10 10 0 0 1 5 60 Z M 13.75 27.5 A 4.25 4.25 0 0 1 22.25 27.5 L 22.25 33.5 A 4.25 4.25 0 0 1 13.75 33.5 Z M 37.75 27.5 A 4.25 4.25 0 0 1 46.25 27.5 L 46.25 33.5 A 4.25 4.25 0 0 1 37.75 33.5 Z" fill="#9b83ff" fill-rule="evenodd"/>
  </g>

  <!-- Inner rim: strokes are clipped to the squircle so only their inner half shows.
       A soft wide glow under a crisp thin edge. -->
  <g clip-path="url(#inside)" fill="none" stroke="url(#rim)">
    <use href="#squircle" stroke-width="40" opacity="0.35" filter="url(#soften)"/>
    <use href="#squircle" stroke-width="16"/>
  </g>
</svg>
